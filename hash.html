<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Жемчуг · Пароль</title><meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;background:#EEF5FB;color:#16335B;margin:0;padding:32px 16px}main{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
input,button,textarea{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid #D6E4F1}button{background:#16335B;color:#fff;border:0;font-weight:700}textarea{font-family:monospace;font-size:13px}</style></head>
<body><main><h1>Хэш пароля</h1><p>Введите пароль для сайта. Скопируйте получившийся код и пришлите его. Сам пароль никуда не отправляется.</p>
<input id="p" type="password" placeholder="Пароль"><input id="p2" type="password" placeholder="Повторите пароль"><button id="b">Получить код</button>
<textarea id="o" rows="3" readonly></textarea><p id="m"></p></main>
<script>
var SALT='zhemchug-images-v1',ITER=150000;
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
document.getElementById('b').onclick=function(){var a=p.value,c=p2.value;if(!a){m.textContent='Введите пароль.';return}if(a!==c){m.textContent='Пароли не совпадают.';return}
var e=new TextEncoder();crypto.subtle.importKey('raw',e.encode(a),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:e.encode(SALT),iterations:ITER,hash:'SHA-256'},k,256)}).then(function(h){o.value=hex(h);o.select();m.textContent='Готово. Скопируйте код и пришлите его.'})}
</script></body></html>
